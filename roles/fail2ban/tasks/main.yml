---
- name: Load OS-family variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

- name: Install repository packages
  ansible.builtin.package:
    name: "{{ fail2ban_repo_packages }}"
    state: present
  when: fail2ban_repo_packages | length > 0

- name: Install fail2ban
  ansible.builtin.package:
    name: "{{ fail2ban_packages }}"
    state: present

# A .local file in jail.d overrides the packaged .conf files.
- name: Configure the sshd jail
  ansible.builtin.template:
    src: jail-sshd.local.j2
    dest: /etc/fail2ban/jail.d/10-baseline-sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: fail2ban config changed

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
