[defaults]
inventory = inventory/hosts.ini
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
# Kept on: turning it off removes MITM protection on first connect. For new
# hosts, opt in per group with ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'.
host_key_checking = True

[privilege_escalation]
become = True

[ssh_connection]
pipelining = True
