---
# Make the container look like a fresh EC2 host: sshd installed, keys present, running.
- name: Prepare
  hosts: all
  gather_facts: false # sudo fails with a PAM error until systemd has finished booting
  tasks:
    - name: Wait for systemd to finish booting
      ansible.builtin.wait_for:
        path: /run/nologin
        state: absent
        timeout: 120

    - name: Gather facts
      ansible.builtin.setup:

    - name: Install sshd
      ansible.builtin.package:
        name: openssh-server
        state: present
        update_cache: true

    - name: Generate SSH host keys
      ansible.builtin.command: ssh-keygen -A
      args:
        creates: /etc/ssh/ssh_host_ed25519_key

    - name: Start sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        state: started

    - name: Create a user without SSH keys for the lockout-guard test
      ansible.builtin.user:
        name: keyless
